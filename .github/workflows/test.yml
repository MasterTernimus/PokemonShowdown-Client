name: Client checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      production_news:
        description: Validate supplied production news (requires configured environment secret)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PS_SERVER_SOURCE: ${{ github.workspace }}/caches/PokemonShowdown-Reborn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: server
        run: node -e "console.log('revision='+require('./server-data-sync-manifest.json').sourceHead)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: MasterTernimus/PokemonShowdown-Reborn
          ref: ${{ steps.server.outputs.revision }}
          path: caches/PokemonShowdown-Reborn
      - run: npm ci && node build
        working-directory: caches/PokemonShowdown-Reborn
      - name: Generate data from the approved server
        run: node build-tools/build-indexes && node build-tools/build-learnsets && node build-tools/build-minidex && npm run build:dev
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run test:unit
        if: ${{ !cancelled() }}
      - run: npm run test:php
        if: ${{ !cancelled() }}
  production-news:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_news }}
    environment: production-news-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Supply the real production news
        env:
          PRODUCTION_NEWS_BASE64: ${{ secrets.PRODUCTION_NEWS_BASE64 }}
        run: node -e "const fs=require('fs');const value=process.env.PRODUCTION_NEWS_BASE64;if(!value)throw Error('Production news secret is required');fs.writeFileSync('config/news.inc.php',Buffer.from(value,'base64'))"
      - run: npm run verify:production-news
